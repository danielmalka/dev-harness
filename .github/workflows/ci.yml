name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Testes
        run: go test ./...
      - name: Validar fontes
        run: go run ./cmd/dh validate --source-only .
      - name: Regenerar pacote
        run: go run ./cmd/dh build
      - name: Pacote igual às fontes e aos binários versionados
        run: |
          git diff --exit-code --stat -- dist ':(exclude)dist/claude-code/dev-harness/harness-manifest.json' ':(exclude)dist/claude-code/dev-harness/GENERATED.txt'
      - name: Validar pacote
        run: go run ./cmd/dh validate .
      # The fixture starts red on purpose (the exercise is to fix it): it must fail
      # with exactly the 2 expected failures, not pass and not break another way.
      - name: Fixture falha como esperado
        working-directory: evals/fixtures/slice-01
        run: |
          if python3 -m unittest test_greet.py > "$RUNNER_TEMP/fixture.log" 2>&1; then
            echo "::error::the fixture passes; it must start red"
            exit 1
          fi
          tail -3 "$RUNNER_TEMP/fixture.log"
          grep -qx 'FAILED (failures=2)' "$RUNNER_TEMP/fixture.log"
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needs only the CLI binary: no login and no API key (checked with an empty
      # HOME and a bare environment). Not pinned on purpose: the mod API is early
      # access (ADR-005), and this job exists to catch a break when it changes.
      # It tests the committed package (what users install); the `kit` job proves
      # that package matches the sources.
      - name: Instalar a CLI do Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Testes dos mods
        run: |
          # The runner shell is `bash -e` without pipefail: without this line `tee`
          # hides the exit code of the CLI and a failed test still turns the job green.
          set -o pipefail
          claude plugin test dist/claude-code/dev-harness | tee mods.log
          # A run that finds no test must not pass.
          grep -Eq '^ *[1-9][0-9]* pass$' mods.log
