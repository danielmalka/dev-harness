name: evals (manual)
# MANUAL ONLY, on purpose (decision of the owner, 2026-11-16). Paid evals are slow,
# so they do not run on pushes or pull requests: run this workflow by hand from the
# Actions tab to measure one feature while it is being implemented. No `evals`
# check shows on a PR, because a green one would measure nothing.
on:
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A manual run without the key must fail, not pass with nothing measured.
      - name: Exigir ANTHROPIC_API_KEY
        env:
          KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$KEY_PRESENT" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY não está definida: nada foi medido."
            exit 1
          fi
      - name: Regenerar pacote
        run: go run ./cmd/dh build
      # Not pinned on purpose. The runner writes the CLI version it used into
      # every result (`claudeVersion` in the baseline JSON), so a run is
      # comparable by what it recorded, not by a number frozen in this file.
      # A pin here would rot between releases and make CI measure an older
      # kit than the machine that produced the baseline.
      - name: Instalar a CLI do Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Rodar evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p evals/results/ci
          claude plugin eval dist/claude-code/dev-harness --trust-plugin --scaffold --runs 1 --ablation none --no-publish --max-cost-usd 15 --threshold 0.8 --output-dir evals/results/ci --json evals/results/ci/aggregate.json
      - name: Enviar resultados das evals
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: evals/results/ci
