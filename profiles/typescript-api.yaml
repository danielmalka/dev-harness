id: typescript-api
name: TypeScript API
summary: Serviços TypeScript ou Node sem interface de usuário renderizada (APIs HTTP, workers, CLIs), verificados por seus testes e contratos.
extends: base
stack:
  - typescript
  - node
commands:
  test: null
  lint: null
  build: null
  run: null
conventions:
  - Leia os scripts do package.json e use esses nomes. Não presuma npm em vez de pnpm ou yarn; o arquivo de lock do repositório indica o gerenciador de pacotes. Um script definido pelo repositório prevalece sobre a invocação direta e é o valor registrado em .harness/project.yaml.
  - Valores típicos observados, registrados só com evidência: test npm test (vitest, jest ou node --test); lint npm run lint; checagem de tipos tsc --noEmit; build npm run build; run npm start ou npm run dev. Os nomes vêm do bloco scripts, não desta lista.
  - A fonte de estilo é a configuração de lint e de formatação que o repositório já tem (config do eslint, prettier, biome, tsconfig.json), referenciada pelos scripts do package.json; ela prevalece sobre preferência pessoal. Nenhum framework é presumido; leia as dependências em busca de Express, Fastify, NestJS, Hono ou outro e siga os idiomas desse framework só quando ele aparece ali.
  - Siga o layout de pastas e o sistema de módulos que já existem (ESM ou CommonJS). Não introduza um novo módulo, pacote ou camada para uma mudança de um arquivo.
  - A checagem de tipos é um quality gate, não aceite. Respeite o rigor do tsconfig.json quando existir; não o afrouxe nem acrescente `any` para silenciar um erro sem um motivo declarado.
  - Quando o serviço recebe entrada externa, valide-a na fronteira do serviço com a abordagem de validação que já existe no repositório (zod, um schema do framework); não confie em corpos de requisição, query strings nem variáveis de ambiente sem parsing.
  - Só quando a fatia muda um endpoint público, as mudanças de HTTP passam pelo contrato do architect (skill api-contracts) antes da implementação; não invente formatos de resposta.
  - Os testes ficam onde o repositório já os coloca (ao lado da fonte ou em test/); quando o repositório tem testes, um comportamento novo é entregue com um teste no nível que o repositório já usa.
  - package.json e o arquivo de lock ficam no conjunto de escrita de toda fatia que adiciona, atualiza ou remove um pacote; o arquivo de lock vai no commit junto com a mudança.
  - Trabalho de banco de dados usa o papel builder na lane dados e a skill data-migrations; as migrações rodam só em um banco descartável durante a verificação.
limits:
  - Não rode npm install, pnpm install nem yarn, nem mude a versão do Node ou o gerenciador de pacotes, sem autorização registrada para a fatia.
  - Não suponha que eslint, prettier, biome, vitest, jest, Docker ou um Makefile estejam presentes; sonde o package.json e a raiz do repositório e registre unknown.
  - Não edite node_modules/, dist/ nem arquivos gerados; as correções vão nas fontes do projeto ou na configuração.
  - Não aplique migrações em um banco que não seja descartável.
  - Um projeto com interface de usuário renderizada pertence ao typescript-web, veja profiles/README.md (Correspondência).
