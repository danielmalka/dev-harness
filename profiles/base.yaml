id: base
name: Base
summary: Convenções compartilhadas do harness quando nenhum perfil de stack corresponde, e o pai de todo perfil de stack.
stack: []
commands:
  test: null
  lint: null
  build: null
  run: null
conventions:
  - O kit é só pt-BR (ADR-011): o Coordenador responde ao dono em português e os registros usam `templates/`. Mensagens de commit e comentários de código seguem o idioma que o projeto define (AGENTS.md, CLAUDE.md, README.md, depois `conventions.code_language` em .harness/project.yaml), inglês quando nada define.
  - Os artefatos do harness usam caminhos relativos à raiz do projeto consumidor.
  - Fatos, hipóteses e decisões são rotulados como tais.
  - O status da evidência é passed, failed ou not-run. Uma checagem de tipos não prova comportamento.
  - Os comandos de checagem vêm de .harness/project.yaml ou de um comando observado no repositório. Nunca invente um runner.
  - .harness/MEMORY.md, EPOCHAL.md e RISKS.md são escritos só pelo Coordenador.
  - Nada de segredos, tokens, credenciais ou caminhos pessoais absolutos em .harness/.
limits:
  - Não instale, atualize nem remova ferramentas, a menos que o dono tenha autorizado essa ação para esta tarefa.
  - Não sobrescreva um arquivo .harness/ existente durante o setup.
  - Não trate a ausência de RISKS.md como prova de que não há incidentes.
