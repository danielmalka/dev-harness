id: go-api
name: Go API
summary: Módulos Go que expõem uma API HTTP, RPC ou webhook, com testes ao lado dos pacotes que cobrem.
extends: base
stack:
  - go
  - module
commands:
  test: go test ./...
  lint: null
  build: go build ./...
  run: go run .
conventions:
  - Siga o layout e os nomes que já existem no módulo. Não introduza uma nova árvore internal/ para uma mudança de um arquivo.
  - Mudanças públicas de HTTP ou RPC passam pelo contrato do architect (skill api-contracts) antes da implementação.
  - Testes orientados a tabela no mesmo pacote do código testado, a menos que o repositório já use um pacote de teste externo.
  - go.mod e go.sum ficam no conjunto de escrita de toda fatia que adiciona ou atualiza uma dependência de módulo.
  - Trabalho de banco de dados usa o papel builder na lane dados e a skill data-migrations; nenhum DSN de produção em fixtures.
limits:
  - Não rode go get nem mude a versão do Go sem autorização registrada para a fatia.
  - Não suponha que golangci-lint, mage ou docker compose estejam presentes; sonde e registre unknown.
  - Não aplique migrações em um banco que não seja descartável.
