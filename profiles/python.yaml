id: python
name: Python
summary: Serviços e pacotes Python gerenciados por pip, uv ou poetry, incluindo backends Django e FastAPI, com testes em tests/.
extends: base
stack:
  - python
commands:
  test: null
  lint: null
  build: null
  run: null
conventions:
  - Leia primeiro pyproject.toml, requirements*.txt, tox.ini ou noxfile.py e qualquer Makefile; um alvo definido pelo repositório prevalece sobre a invocação direta e é o valor registrado em .harness/project.yaml. Use o gerenciador de ambiente do repositório (uv, poetry, venv) como já está configurado.
  - Valores típicos observados, registrados só com evidência: test pytest ou python manage.py test (Django); lint ruff check ou flake8; checagem de tipos mypy ou pyright; checagem de formato ruff format --check ou black --check; run uvicorn <module>:app (FastAPI) ou python manage.py runserver (Django).
  - A fonte de estilo é a PEP 8 e a configuração de formatador e linter que já está em pyproject.toml, setup.cfg ou tox.ini, que prevalece sobre ela. Aplique aos arquivos que a fatia toca, não ao código intocado.
  - Siga o layout que já existe (layout src/ ou pacote plano, ou o layout de apps do Django). Não introduza um novo módulo, pacote ou camada para uma mudança de um arquivo.
  - Adicione type hints às novas funções públicas quando o repositório já os usa; rode o verificador de tipos configurado no rigor configurado, não em um mais rígido.
  - Os testes ficam em tests/ (ou no módulo de testes do app) e usam o runner que o repositório já usa; quando o repositório tem testes, um comportamento novo é entregue com um teste no nível que o repositório já usa.
  - Seção Django, vale só quando django aparece nas dependências ou manage.py existe: siga as camadas que já existem (lógica em models e services em vez de views quando esse é o padrão do repositório), use o ORM e a estrutura de apps que já existem, mantenha as settings divididas como o repositório as tem e nunca fixe SECRET_KEY nem credenciais de banco no código. Os comandos desta seção são registrados só com evidência.
  - Seção FastAPI, vale só quando fastapi aparece nas dependências: declare os formatos de requisição e resposta com modelos Pydantic, siga as camadas que já existem (funções de rota enxutas quando esse é o padrão do repositório), use Depends para recursos compartilhados e mantenha as rotas async sem chamadas bloqueantes. Os comandos desta seção são registrados só com evidência.
  - Só quando a fatia muda um endpoint público, as mudanças de HTTP passam pelo contrato do architect (skill api-contracts) antes da implementação.
  - O manifesto de dependências e o arquivo de lock (pyproject.toml, uv.lock, poetry.lock, requirements*.txt) ficam no conjunto de escrita de toda fatia que adiciona, atualiza ou remove um pacote.
  - Trabalho de banco de dados usa o papel builder na lane dados e a skill data-migrations; as migrações (Django migrate, Alembic) rodam só em um banco descartável durante a verificação.
limits:
  - Não instale nem troque a versão do Python, o uv, o poetry, o pip ou um ambiente virtual, e não rode instalação ou atualização de dependências, sem autorização registrada para a fatia.
  - Não suponha que ruff, mypy, pytest, flake8, black, Docker ou um Makefile estejam presentes; sonde os manifestos e a raiz do repositório e registre unknown.
  - Não edite ambientes virtuais, site-packages nem arquivos gerados; as correções vão nas fontes do projeto ou na configuração.
  - Não aplique migrações nem carregue fixtures em um banco que não seja descartável.
