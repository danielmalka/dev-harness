id: typescript-web
name: TypeScript web
summary: Aplicações TypeScript com interface de usuário renderizada, verificadas em um navegador quando houver um disponível.
extends: base
stack:
  - typescript
  - node
commands:
  test: null
  lint: null
  build: null
  run: null
conventions:
  - Leia os scripts do package.json e use esses nomes. Não presuma npm em vez de pnpm ou yarn.
  - As fatias de UI incluem os estados de carregamento, de erro e vazio que o resumo de fato exige.
  - A checagem de tipos é um quality gate, não aceite. A evidência de interação exige um navegador ou um not-run explícito.
  - Novas chamadas de API pública seguem o contrato já combinado com o backend. Não invente formatos de resposta.
  - Os ativos necessários para renderizar a mudança ficam no repositório consumidor ou neste kit, nunca na máquina do autor.
limits:
  - Não rode npm install, pnpm install nem yarn sem autorização registrada para a fatia.
  - Não marque uma fatia de UI como verificada quando o navegador não estava disponível.
  - Não reestilize páginas não relacionadas nem troque o design system em uma fatia de comportamento.
