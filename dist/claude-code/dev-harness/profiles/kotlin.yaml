id: kotlin
name: Kotlin
summary: Serviços Kotlin na JVM construídos com Gradle ou Maven, incluindo backends Spring Boot, Quarkus e Micronaut, com testes ao lado do código que cobrem.
extends: base
stack:
  - kotlin
  - jvm
commands:
  test: null
  lint: null
  build: null
  run: null
conventions:
  - Leia primeiro os arquivos de build (settings.gradle.kts, build.gradle.kts, pom.xml) e qualquer Makefile; uma tarefa definida pelo repositório prevalece sobre a invocação direta e é o valor registrado em .harness/project.yaml. Use o wrapper do Gradle ou do Maven do repositório (./gradlew, ./mvnw), nunca uma instalação global.
  - Valores típicos observados, registrados só com evidência: test ./gradlew test ou ./mvnw test; build ./gradlew build ou ./mvnw package; lint ./gradlew ktlintCheck ou ./gradlew detekt só quando esse plugin aparece nos arquivos de build; run por framework: ./gradlew bootRun ou ./mvnw spring-boot:run (Spring Boot), ./gradlew quarkusDev ou ./mvnw quarkus:dev (Quarkus), ./gradlew run (Micronaut).
  - A fonte de estilo é o Kotlin Coding Conventions (kotlinlang.org/docs/coding-conventions.html) e, quando presente, a configuração .editorconfig ou ktlint/detekt do repositório, que prevalece sobre ele. Aplique aos arquivos que a fatia toca, não ao código intocado.
  - Siga o layout de pacotes, os nomes e os source sets (src/main/kotlin, src/test/kotlin) que já existem. Não introduza um novo módulo, pacote ou camada para uma mudança de um arquivo.
  - Conforme o Kotlin Coding Conventions, prefira val a var, data classes imutáveis para valores e null-safety ao operador !!; use !! ou lateinit só com um motivo declarado.
  - Só quando a fatia muda um endpoint público, as mudanças de HTTP ou RPC passam pelo contrato do architect (skill api-contracts) antes da implementação.
  - Os testes ficam em src/test/kotlin, espelhando o pacote principal, e usam o framework que o build já declara (JUnit 5, Kotest); quando o repositório tem testes, um comportamento novo é entregue com um teste no nível que o repositório já usa.
  - Seção Spring Boot, vale só quando org.springframework.boot aparece nos arquivos de build: use injeção por construtor, siga as camadas que já existem (controllers enxutos quando esse é o padrão do repositório), vincule a configuração com @ConfigurationProperties e mantenha as configurações específicas de perfil nos arquivos application-<profile> que já existem. Os comandos desta seção são registrados só com evidência.
  - Seção Quarkus, vale só quando io.quarkus aparece nos arquivos de build: use beans CDI e as extensões já declaradas, mantenha as configurações no application.properties ou application.yaml que já existe e escreva testes de integração com @QuarkusTest como o repositório já faz. Os comandos desta seção são registrados só com evidência.
  - Seção Micronaut, vale só quando io.micronaut aparece nos arquivos de build: use injeção de dependência em tempo de compilação e as anotações que o projeto já usa, mantenha as configurações no application.properties ou application.yaml que já existe e escreva testes com @MicronautTest como o repositório já faz. Os comandos desta seção são registrados só com evidência.
  - Quando a fatia muda dependências, build.gradle.kts, settings.gradle.kts, gradle/libs.versions.toml ou pom.xml ficam no conjunto de escrita dela.
  - Trabalho de banco de dados usa o papel builder na lane dados e a skill data-migrations; as migrações (Flyway, Liquibase) rodam só em um banco descartável durante a verificação.
limits:
  - Não instale nem troque o JDK, o Gradle, o Maven ou a versão do wrapper, e não rode atualização de dependências, sem autorização registrada para a fatia.
  - Não suponha que ktlint, detekt, Docker ou um Makefile estejam presentes; sonde os arquivos de build e a raiz do repositório e registre unknown.
  - Não edite build/, .gradle/ nem fontes geradas; as correções vão nas fontes do projeto ou na configuração de build.
  - Fora de escopo: projetos Kotlin Android e Multiplatform, e frameworks além dos três citados; use as convenções do base e registre none, custom para esses.
  - Não aplique migrações em um banco que não seja descartável.
