# Example of a consumer .harness/project.yaml produced by /dh:setup.
# Copy is not automatic: setup writes this file only when it is absent and writing is authorized.
# This example is documentation. It is not a stack profile.

profile: go-api
profile_source: profiles/go-api.yaml
commands:
  test:
    value: go test ./...
    source: observed Makefile target "test"
  lint:
    value: null
    source: unknown
  build:
    value: go build ./...
    source: observed Makefile target "build"
  run:
    value: go run ./cmd/server
    source: observed cmd/server
conventions_applied:
  - profiles/base.yaml
  - profiles/go-api.yaml
conflicts: []
notes:
  - Existing AGENTS.md (canonical) and CLAUDE.md outrank this file.
# conventions.code_language is optional: the language of commit messages and code comments (en or pt-br).
# Without it, and without a definition in AGENTS.md, CLAUDE.md or README.md, English applies. dh doctor rejects any other value.
# Setup writes it only when it finds the definition in one of those files.
# conventions:
#   code_language: en
# reviewers: is optional; absent means Claude only, with no other CLI to rotate.
# When reviewers.code is set, the first code entry of a task is claude if listed,
# otherwise the first entry; a later entry of the same task advances one entry.
# Not written by setup — the owner adds it by hand when opting into external CLI review.
# reviewers:
#   document: [claude, "cli:agy/gemini-3.1-pro-high"]
#   code: [claude, "cli:codex/gpt-5.6-sol"]
#   security: [claude]
