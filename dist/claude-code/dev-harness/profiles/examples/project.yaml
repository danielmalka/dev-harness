# Exemplo de um .harness/project.yaml de consumidor produzido pelo /dh:setup.
# A cópia não é automática: o setup escreve este arquivo só quando ele não existe e a escrita está autorizada.
# Este exemplo é documentação. Não é um perfil de stack.

profile: go-api
profile_source: profiles/go-api.yaml
commands:
  test:
    value: go test ./...
    source: alvo "test" do Makefile observado
  lint:
    value: null
    source: unknown
  build:
    value: go build ./...
    source: alvo "build" do Makefile observado
  run:
    value: go run ./cmd/server
    source: cmd/server observado
conventions_applied:
  - profiles/base.yaml
  - profiles/go-api.yaml
conflicts: []
notes:
  - O AGENTS.md existente (canônico) e o CLAUDE.md prevalecem sobre este arquivo.
# conventions.code_language é opcional: o idioma das mensagens de commit e dos comentários de código (en ou pt-br).
# Sem ele, e sem definição no AGENTS.md, CLAUDE.md ou README.md, vale o inglês. O dh doctor rejeita qualquer outro valor.
# O setup só o escreve quando encontra a definição em um desses arquivos.
# conventions:
#   code_language: en
# reviewers: é opcional; ausente significa só Claude, sem outra CLI para rotacionar.
# Quando reviewers.code está definido, a primeira entrada code de uma tarefa é claude se listado,
# senão a primeira entrada; uma entrada seguinte da mesma tarefa avança uma entrada.
# Não é escrito pelo setup — o dono o acrescenta à mão ao optar pela revisão por CLI externa.
# reviewers:
#   document: [claude, "cli:agy/gemini-3.1-pro-high"]
#   code: [claude, "cli:codex/gpt-5.6-sol"]
#   security: [claude]
