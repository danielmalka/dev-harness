id: php
name: PHP
summary: Projetos PHP gerenciados pelo Composer, incluindo bases de código de framework ou CMS (Laravel, Symfony, Craft) em que a lógica de negócio fica em um namespace dedicado e os testes rodam com Pest ou PHPUnit.
extends: base
stack:
  - php
  - composer
commands:
  test: null
  lint: null
  build: null
  run: null
conventions:
  - Leia primeiro os scripts do composer.json e qualquer Makefile; um alvo definido pelo repositório, como make check, prevalece sobre a invocação direta de vendor/bin e é o valor registrado em .harness/project.yaml.
  - Valores típicos observados, registrados só com evidência: test vendor/bin/pest ou vendor/bin/phpunit; lint vendor/bin/phpstan analyse; checagem de formato vendor/bin/php-cs-fixer fix --dry-run --diff; run docker compose up -d quando o repositório traz um arquivo compose.
  - Quando o PHP roda dentro de um contêiner, todo comando de checagem é executado pelo contêiner (docker compose exec ou a variável EXEC do Makefile); um host sem php ou composer reporta as checagens como not-run, nunca como passed.
  - As regras estritas (declare(strict_types=1), PSR-12, phpstan no nível configurado) valem para os namespaces que o projeto marca como lógica de negócio, tipicamente src/, app/ ou modules/, mais tests/. A configuração de framework ou CMS, os templates, as migrações e public/ ficam de fora, salvo se o projeto disser o contrário.
  - Arquivos novos de lógica de negócio começam com declare(strict_types=1); os controllers ficam enxutos e delegam a serviços; nada de supressão de erro com @ e nada de mixed sem um motivo declarado.
  - Um arquivo de baseline do phpstan, quando presente, cobre só achados preexistentes; o código novo responde ao nível configurado e a baseline não é regenerada para esconder um achado novo.
  - Os testes ficam em tests/ seguindo a divisão existente (Unit, Feature); um comportamento novo é entregue com um teste no mesmo nível que o repositório já usa.
  - composer.json e composer.lock ficam no conjunto de escrita de toda fatia que adiciona, atualiza ou remove um pacote; o arquivo de lock vai no commit junto com a mudança.
  - Trabalho de banco de dados usa o papel builder na lane dados e a skill data-migrations; as migrações do framework rodam só em um banco descartável durante a verificação.
limits:
  - Não rode composer require nem composer update, nem mude a versão do PHP, sem autorização registrada para a fatia.
  - Não suponha que Pest, PHPUnit, phpstan, php-cs-fixer, Docker ou um Makefile estejam presentes; sonde vendor/bin e a raiz do repositório e registre unknown.
  - Não edite vendor/ nem arquivos gerados do framework; as correções vão no namespace do projeto ou na configuração.
  - Não inicie, pare nem reconstrua contêineres por conta própria; reporte o estado da stack e pergunte quando uma checagem depender disso.
  - Não aplique migrações, seeders nem sincronizações de project-config do CMS em um banco que não seja descartável.
